name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          GROQ_API_KEY: dummy
          AZURE_VISION_ENDPOINT: https://dummy.example.com
          AZURE_VISION_KEY: dummy
          AZURE_OPENAI_API_KEY: dummy
          AZURE_OPENAI_ENDPOINT: https://dummy.example.com
          AZURE_STORAGE_CONNECTION_STRING: dummy
          AZURE_SEARCH_KEY: dummy
          AZURE_SEARCH_ENDPOINT: https://dummy.example.com
          AZURE_DOCUMENT_INTELLIGENCE_KEY: dummy
          AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: https://dummy.example.com
        run: python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (fails on lint errors, same as local CI=true npm run build)
        env:
          CI: true
        run: npm run build